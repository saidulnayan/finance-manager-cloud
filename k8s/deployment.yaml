apiVersion: apps/v1
kind: Deployment
metadata:
  name: finance-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: finance
  template:
    metadata:
      labels:
        app: finance
    spec:
      containers:
      - name: finance
        image: financeacr123.azurecr.io/finance-app:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: finance-service
spec:
  type: LoadBalancer
  ports:
  - port: 80          # The port you use in the browser
    targetPort: 5000  # The port your app runs on (must match containerPort)
  selector:
    app: finance